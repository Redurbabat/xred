name: Android-APK bauen

# Baut bei jeder Änderung auf main automatisch die Android-App und
# veröffentlicht die APK als GitHub-Release „apk“. So kann sie direkt
# auf dem Handy heruntergeladen werden – ganz ohne PC.
on:
  push:
    branches: [main]
    paths:
      - "instagram-monitor/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

# Zwei schnell aufeinanderfolgende Pushes schrieben sonst gleichzeitig auf
# dasselbe Release „apk“ – welche APK gewinnt, war Zufall.
concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Signatur-Material kommt NUR aus GitHub-Secrets (nichts davon liegt im
    # Repo).
    #
    # Damit sich eine neue APK OHNE Deinstallieren über die alte installiert,
    # muss JEDE APK mit DEMSELBEN Schlüssel signiert sein. Genau das ging
    # früher schief: Der Schlüssel wurde hier im Lauf erzeugt und über den
    # Actions-Cache weitergereicht, und sein Passwort war die öffentliche
    # Repository-ID. GitHub löscht Cache-Einträge aber nach 7 Tagen ohne
    # Zugriff, und beim Umzug in ein anderes Repo ändert sich die ID – in
    # beiden Fällen entstand ein NEUER Schlüssel und damit eine APK, die
    # Android als fremde App ansieht („Paket-Konflikt“).
    #
    # Deshalb: Der Keystore wird EINMAL lokal erzeugt und als Secret
    # hinterlegt (Anleitung in instagram-monitor/README.md, Abschnitt
    # „Signaturschlüssel einrichten“). Ohne diese Secrets läuft der Build
    # weiter, signiert aber mit der wechselnden Debug-Signatur – die APK
    # lässt sich dann nur nach Deinstallieren der alten installieren.
    env:
      IGMON_KEYSTORE_B64: ${{ secrets.IGMON_KEYSTORE_B64 }}
      IGMON_KEYSTORE_FILE: ${{ github.workspace }}/igmon-signing/igmonitor.p12
      IGMON_STORE_PASSWORD: ${{ secrets.IGMON_STORE_PASSWORD }}
      IGMON_KEY_PASSWORD: ${{ secrets.IGMON_KEY_PASSWORD }}
      IGMON_KEY_ALIAS: ${{ secrets.IGMON_KEY_ALIAS || 'igmonitor' }}
      # Steigende Nummer je Lauf: Am Handy ist damit erkennbar, welcher
      # Stand installiert ist, und Android erkennt Neueres als Neueres.
      IGMON_VERSION_CODE: ${{ github.run_number }}
      IGMON_VERSION_NAME: "1.0.${{ github.run_number }}"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy braucht ein Build-Python in derselben Version wie das
      # eingebettete Python (3.12).
      - uses: actions/setup-python@v5
        with:
          # Kein pip-Cache: Dieser Job installiert keine Python-Pakete
          # (Chaquopy holt sie selbst im Gradle-Build). Der Cache-Schritt
          # findet am Ende kein ~/.cache/pip und lässt den ganzen Lauf
          # scheitern – obwohl die APK längst fertig ist.
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Signatur-Keystore aus dem Secret schreiben
        id: keystore
        run: |
          set -e
          if [ -z "$IGMON_KEYSTORE_B64" ] || [ -z "$IGMON_STORE_PASSWORD" ] \
             || [ -z "$IGMON_KEY_PASSWORD" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Kein Signaturschlüssel hinterlegt (Secrets" \
                 "IGMON_KEYSTORE_B64, IGMON_STORE_PASSWORD, IGMON_KEY_PASSWORD)." \
                 "Die APK wird mit einer WECHSELNDEN Debug-Signatur gebaut und" \
                 "lässt sich nicht über eine bereits installierte Version" \
                 "drüberinstallieren. Anleitung: README, Abschnitt" \
                 "'Signaturschlüssel einrichten'."
            exit 0
          fi
          mkdir -p "$(dirname "$IGMON_KEYSTORE_FILE")"
          echo "$IGMON_KEYSTORE_B64" | base64 -d > "$IGMON_KEYSTORE_FILE"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "Keystore aus Secret geschrieben ($(wc -c < "$IGMON_KEYSTORE_FILE") Bytes)."

      # Mit eigenem Schlüssel: richtige Release-APK (nicht debuggbar – in der
      # App stecken Instagram-/X-Sitzungen). Ohne Schlüssel bliebe eine
      # Release-APK unsigniert und ließe sich gar nicht installieren; dann
      # also weiter die Debug-Variante.
      - name: APK bauen
        id: build
        working-directory: instagram-monitor/android
        run: |
          set -e
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            gradle --no-daemon assembleRelease
            echo "apk=instagram-monitor/android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
          else
            gradle --no-daemon assembleDebug
            echo "apk=instagram-monitor/android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
          fi

      # Kontrolle: Bleibt der Fingerabdruck über Builds gleich, installieren
      # sich Updates ohne Deinstallieren.
      - name: Signatur-Fingerabdruck anzeigen
        if: steps.keystore.outputs.signed == 'true'
        run: |
          keytool -list -keystore "$IGMON_KEYSTORE_FILE" -storetype PKCS12 \
            -storepass "$IGMON_STORE_PASSWORD" -alias "$IGMON_KEY_ALIAS" \
            | grep -i "SHA256" || true

      - name: APK umbenennen
        run: cp "${{ steps.build.outputs.apk }}" InstagramMonitor.apk

      - name: APK als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: "📱 Instagram Monitor – Android-App"
          body: |
            Neueste Android-App (wird bei jeder Änderung automatisch neu gebaut).

            **Version:** 1.0.${{ github.run_number }} · Stand ${{ github.sha }}

            **Installation auf dem Handy:**
            1. Diese Seite auf dem Handy öffnen und `InstagramMonitor.apk` herunterladen.
            2. Die heruntergeladene Datei antippen → Installation aus unbekannten Quellen einmalig erlauben → installieren.
            3. App öffnen – der Server startet automatisch im Hintergrund; danach wie gewohnt anmelden (am besten per sessionid, siehe „Erweitert“ im Anmelde-Feld).

            Downloads („⤓ Gerät“) landen im Download-Ordner des Handys.
          files: InstagramMonitor.apk

      # Zusätzlich als Build-Artefakt sichern (falls das Release fehlschlägt).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: InstagramMonitor-APK
          path: instagram-monitor/android/app/build/outputs/apk/*/*.apk
          if-no-files-found: ignore
